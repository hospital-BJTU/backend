config:
  target: "http://localhost:3000"
  phases:
    # 预热阶段：从5 req/s开始，持续1分钟
    - duration: 60
      arrivalRate: 5
      name: 预热阶段
    # 标准负载阶段：50 req/s，持续2分钟
    - duration: 120
      arrivalRate: 50
      name: 标准负载阶段
    # 峰值验收阶段：100 req/s，持续2分钟
    - duration: 120
      arrivalRate: 100
      name: 峰值验收阶段
    # 极限压力测试：200 req/s，持续1分钟（可选）
    - duration: 60
      arrivalRate: 200
      name: 极限压力测试
  defaults:
    headers:
      Content-Type: "application/json"
      Connection: "keep-alive"  # 启用HTTP长连接
  payload:
    path: "artillery_test_users.csv"
    fields: ["username", "password", "phone", "userId", "role"]
    delimiter: ","
    skipHeader: true
    shareIterations: false

# 自动化验收门禁
ensure:
  thresholds:
    - http.response_time.p95: 200  # 95%请求响应时间不超过200ms
    - http.response_time.p99: 500  # 99%请求响应时间不超过500ms
    - http.codes.200: 99           # 成功率不低于99%
    - http.codes.500: 0            # 不允许500错误
  conditions:
    - "http.response_time.p95 < 200"
    - "http.response_time.p99 < 500"
    - "http.codes.200 >= 99"
    - "http.codes.500 == 0"

services:
  - "@artilleryio/plugin-http-async"

scenarios:
  - name: "测试预约功能"
    flow:
      # 步骤1: 用户登录
      - post:
          url: "/api/users/login"
          json:
            username: "{{ username }}"
            password: "{{ password }}"
          capture:
            - json: "$.data.token"
              as: "token"
          expect:
            - statusCode: 200

      # 步骤2: 获取可预约排班列表
      - get:
          url: "/api/user/available-schedules"
          headers:
            Authorization: "Bearer {{ token }}"
          capture:
            - json: "$.data.schedules[0].scheduleId"
              as: "scheduleId"
          expect:
            - statusCode: 200
            - hasProperty: "data.schedules"
            - evaluate: "$response.body.data.schedules.length > 0"

      # 步骤3: 创建预约 (关键并发测试点)
      - post:
          url: "/api/user/appointments"
          headers:
            Authorization: "Bearer {{ token }}"
          json:
            scheduleId: "{{ scheduleId }}"
          expect:
            - statusCode: 201
